name: executable gaol pages

# Publishes the promoted viewer. The study still compiles the plans and the area
# collection the viewer consumes; what is published is `apps/nomos-viewer/dist`,
# staged from those artifacts, scanned, and only then uploaded - and the browser
# lane runs first, so the page that goes out is a page that was played.

on:
  push:
    branches:
      - main
      - "experiment/issue-*-executable-gaol"
    paths:
      - ".github/workflows/executable-gaol-pages.yml"
      - ".github/workflows/nomos-viewer.yml"
      - "apps/nomos-viewer/**"
      - "experiments/executable-gaol/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: executable-gaol-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Verify the study and publish its artifacts
        run: experiments/executable-gaol/gaol verify

      # The authoritative runtime, before anything that stages or loads it —
      # the same two steps as .github/workflows/nomos-viewer.yml. This workflow
      # runs only on push to main, so a PR lane cannot catch their absence.
      - name: Build the play runtime for the browser
        run: crates/nomos-play/build-wasm.sh

      - name: Build the native play runtime
        run: cargo build --locked -p nomos-play

      - name: Viewer tests
        run: node --test apps/nomos-viewer/test/*.test.mjs

      - name: Stage and scan the public artifact
        run: |
          node apps/nomos-viewer/build.mjs \
            --from target/executable-gaol \
            --wasm target/wasm32-unknown-unknown/wasm/nomos_play.wasm \
            --out apps/nomos-viewer/dist

      - name: Browser smoke lane
        run: |
          node apps/nomos-viewer/smoke/smoke.mjs \
            --dist apps/nomos-viewer/dist \
            --out target/nomos-viewer-smoke \
            --require-chrome

      - name: Upload the screenshots and the offline receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nomos-viewer-pages-smoke
          path: target/nomos-viewer-smoke
          if-no-files-found: error
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload the promoted viewer
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/nomos-viewer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - name: Publish the demo
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
