name: verify

# The checks that need a git checkout: the evaluation harnesses make worktrees
# and commits of the repository itself, so they cannot run in the Nix sandbox.
# Formatting, lints, tests, the KERNEL.md section 10 dependency-boundary check
# and the frozen canonicalization regression are the flake's (`flake.yml`). The
# separate `gate-k-evidence.yml` workflow owns the process-level three-target
# determinism matrix and measured acceptance-16 evidence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Debug info is capped by the workspace `[profile.dev]` setting rather than
  # here, so a local build and a CI build measure the same thing.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # The toolchains are the flake's dev shell, the same as `nix develop`
        # locally.
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Disk before
        run: |
          df -h
          du -sh ~/.cargo 2>/dev/null || true

      - name: Record the pinned toolchain
        run: |
          rustc --version
          cargo --version
          python3 --version
          jq --version

      - name: Agy print preflight harness
        run: docs/evaluation/test-agy-print-preflight.sh

      - name: Agy formal boundary harness
        run: docs/evaluation/test-agy-formal-boundary-preflight.sh

      - name: Pi cold-agent boundary harness
        run: docs/evaluation/test-pi-cold-agent-preflight.sh

      - name: Gate K evaluation packet and recorder harness
        run: docs/evaluation/test-gate-k-eval-tooling.sh

      - name: Build
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo build --workspace --locked
          echo "build seconds: $(( $(date +%s) - start ))"

      - name: Coarse disk diagnostics (not acceptance-16 evidence)
        if: always()
        run: |
          du -sh target
          du -sh ~/.cargo 2>/dev/null || true
          df -h
